server:
  port: 8081

spring:
  application:
    name: chat-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/chat-service-db
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:password}
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/chat-service-db
    user: ${DB_USER:postgres}
    password: ${DB_PASSWORD:password}
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate

app:
  datasource:
    main:
      url: jdbc:postgresql://localhost:5432/school-application-db
      username: ${DB_USER:postgres}
      password: ${DB_PASSWORD:password}
      driver-class-name: org.postgresql.Driver

services:
  main-service:
    url: http://localhost:8080

springdoc:
  packagesToScan: com.education.controller
  pathsToMatch: /api/v1/chat-service/**
